<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background building facade pattern & gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e" />
      <stop offset="50%" stop-color="#14161b" />
      <stop offset="100%" stop-color="#090a0c" />
    </linearGradient>

    <!-- Window reflection gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2e38" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3d4352" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1c1f26" stop-opacity="0.5" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Banner Shadow -->
    <filter id="bannerShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-1" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Dark Urban Architecture Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" />

  <!-- Skyscraper Perspective Facade Lines (Left Side) -->
  <g opacity="0.35" stroke="#363c4a" stroke-width="1.5">
    <!-- Vertical Building mullions -->
    <line x1="20" y1="0" x2="60" y2="500" stroke-width="2.5" />
    <line x1="65" y1="0" x2="115" y2="500" stroke-width="2" />
    <line x1="110" y1="0" x2="170" y2="500" stroke-width="2" />
    <line x1="155" y1="0" x2="225" y2="500" />
    
    <!-- Floor grid lines -->
    <line x1="0" y1="50" x2="250" y2="70" />
    <line x1="0" y1="110" x2="250" y2="135" />
    <line x1="0" y1="170" x2="250" y2="200" />
    <line x1="0" y1="230" x2="250" y2="265" />
    <line x1="0" y1="290" x2="250" y2="330" />
    <line x1="0" y1="350" x2="250" y2="395" />
    <line x1="0" y1="410" x2="250" y2="460" />
    <line x1="0" y1="470" x2="250" y2="520" />
  </g>

  <!-- Skyscraper Perspective Facade Lines (Right Side) -->
  <g opacity="0.35" stroke="#363c4a" stroke-width="1.5">
    <line x1="480" y1="0" x2="440" y2="500" stroke-width="2.5" />
    <line x1="435" y1="0" x2="385" y2="500" stroke-width="2" />
    <line x1="390" y1="0" x2="330" y2="500" stroke-width="2" />
    <line x1="345" y1="0" x2="275" y2="500" />

    <line x1="500" y1="50" x2="250" y2="70" />
    <line x1="500" y1="110" x2="250" y2="135" />
    <line x1="500" y1="170" x2="250" y2="200" />
    <line x1="500" y1="230" x2="250" y2="265" />
    <line x1="500" y1="290" x2="250" y2="330" />
    <line x1="500" y1="350" x2="250" y2="395" />
    <line x1="500" y1="410" x2="250" y2="460" />
    <line x1="500" y1="470" x2="250" y2="520" />
  </g>

  <!-- Window pattern tiles in background for texture -->
  <g opacity="0.15">
    <rect x="25" y="60" width="30" height="40" fill="#ffffff" />
    <rect x="75" y="125" width="25" height="35" fill="#ffffff" />
    <rect x="35" y="240" width="32" height="40" fill="#ffffff" />
    <rect x="85" y="310" width="28" height="38" fill="#ffffff" />
    <rect x="440" y="70" width="30" height="40" fill="#ffffff" />
    <rect x="390" y="145" width="25" height="35" fill="#ffffff" />
    <rect x="430" y="250" width="30" height="40" fill="#ffffff" />
    <rect x="380" y="330" width="28" height="38" fill="#ffffff" />
  </g>

  <!-- 2. White Card (Rotated ~ -7 degrees) -->
  <g transform="rotate(-7, 255, 235)" filter="url(#cardShadow)">
    <rect x="110" y="40" width="290" height="295" rx="2" fill="#ffffff" />

    <!-- Big Blue Hebrew Text "לא" -->
    <text 
      x="255" 
      y="245" 
      text-anchor="middle" 
      fill="#3374c4" 
      font-family="'Heebo', 'Rubik', 'Assistant', 'Segoe UI', Arial, sans-serif" 
      font-weight="900" 
      font-size="195" 
      letter-spacing="-6"
      direction="rtl"
    >לא</text>
  </g>

  <!-- 3. Slanted Yellow Banner "מחכים לדירה" (Rotated ~ -3.5 degrees) -->
  <g transform="rotate(-3.5, 250, 360)" filter="url(#bannerShadow)">
    <rect x="25" y="305" width="455" height="118" fill="#f5e000" />

    <!-- Bold Black Hebrew Text "מחכים לדירה" -->
    <text 
      x="252" 
      y="386" 
      text-anchor="middle" 
      fill="#0c0d10" 
      font-family="'Heebo', 'Rubik', 'Assistant', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="62" 
      letter-spacing="-1.5"
      direction="rtl"
    >מחכים לדירה</text>
  </g>
</svg>
